# Active Profile
spring.profiles.active=dev
spring.application.name=laundry-backend

# Server Port Config (Render dynamic port)
server.port=${PORT:8080}

# Supabase PostgreSQL Configuration (supports env override)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.eputmfbpfjsvmpmhopdq}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Camomot12345@}

# Hikari Connection Pool settings (prevents Supabase EMAXCONNSESSION pool exhaustion)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000

# JPA/Hibernate configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# JWT settings
laundry.jwtSecret=laundryInventoryManagementSystemSecretKeyMustBe32BytesLong
laundry.jwtExpirationMs=86400000

# CORS Allowed Origins
laundry.allowedOrigins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176}
